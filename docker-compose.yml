services:
  teamflow-api:
    image: teamflow-api
    build:
      context: .
      dockerfile: ./TeamFlow.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=teamflow_db;Username=postgres;Password=postgres_password_123
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Secret=YourSuperSecretKeyWithAtLeast32BytesLength!
      - JwtSettings__Issuer=TeamFlowApi
      - JwtSettings__Audience=TeamFlowClient
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: teamflow-postgres
    environment:
      POSTGRES_DB: teamflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: teamflow-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: